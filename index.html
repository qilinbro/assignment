<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语课程作业管家</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--blue:#007AFF;--blue-bg:#E8F0FE;--green:#34C759;--green-bg:#E8F8EC;
--orange:#FF9500;--orange-bg:#FFF4E6;--red:#FF3B30;--red-bg:#FFEBEE;
--gray:#8E8E93;--gray2:#C7C7CC;--gray3:#E5E5EA;--gray4:#F2F2F7;
--text:#1C1C1E;--text2:#3C3C43;--text3:#8E8E93;
--card:#FFFFFF;--radius:14px;
}
body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
background:var(--gray4);color:var(--text);-webkit-font-smoothing:antialiased
}

/* LOGIN */
.login-screen{
position:relative;min-height:100vh;
background:#FFFFFF;
display:flex;align-items:center;justify-content:center;
padding:20px;overflow:hidden
}
.login-box{
position:relative;width:100%;max-width:400px;padding:40px;
background:#FFFFFF;border-radius:16px;
box-sizing:border-box;
box-shadow:0 2px 20px rgba(0,0,0,.05)
}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo img{max-width:120px;max-height:120px;border-radius:12px}
.login-box h2{margin:0 0 28px;color:#1C1C1E;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.5px}
.login-box .user-box{position:relative;margin-bottom:28px}
.login-box .user-box input{
width:100%;padding:10px 0;font-size:16px;color:#1C1C1E;
border:none;border-bottom:1px solid #D1D1D6;
outline:none;background:transparent;transition:border-color .3s
}
.login-box .user-box input:focus{border-bottom-color:#007AFF}
.login-box .user-box label{
position:absolute;top:0;left:0;padding:10px 0;
font-size:16px;color:#8E8E93;pointer-events:none;transition:.3s
}
.login-box .user-box input:focus~label,
.login-box .user-box input:valid~label{
top:-20px;left:0;color:#007AFF;font-size:12px
}
.login-box .login-btn{
width:100%;padding:14px;
background:#007AFF;color:#fff;
border:none;border-radius:12px;
font-size:17px;font-weight:600;
cursor:pointer;transition:opacity .2s;
margin-top:8px
}
.login-box .login-btn:active{opacity:.7}
.login-hint{
text-align:center;margin-top:24px;padding-top:16px;
border-top:1px solid #F2F2F7;
font-size:12px;color:#8E8E93;line-height:1.8
}

/* NAV */
.nav{
background:rgba(255,255,255,.82);
backdrop-filter:saturate(180%) blur(20px);
-webkit-backdrop-filter:saturate(180%) blur(20px);
border-bottom:1px solid var(--gray3);
height:52px;display:flex;align-items:center;
position:sticky;top:0;z-index:99
}
.nav-in{
max-width:1000px;margin:0 auto;width:100%;
padding:0 20px;display:flex;justify-content:space-between;align-items:center
}
.nav-logo{font-size:17px;font-weight:700;letter-spacing:-.3px}
.nav-user{font-size:14px;color:var(--text2);display:flex;align-items:center;gap:10px}
.nav-logout{
background:transparent;border:none;color:var(--blue);
font-size:14px;font-weight:500;cursor:pointer;padding:4px 8px
}

/* LAYOUT */
.container{max-width:1000px;margin:0 auto;padding:24px 20px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.8px;margin-bottom:4px}
.page-sub{font-size:15px;color:var(--text3);margin-bottom:24px}

/* CARDS */
.card{
background:var(--card);border-radius:var(--radius);
margin-bottom:12px;overflow:hidden
}
.card-pad{padding:20px}
.card-header{
padding:16px 20px;border-bottom:1px solid var(--gray4);
display:flex;align-items:center;justify-content:space-between
}
.card-title{font-size:17px;font-weight:600}
.card-body{padding:4px 20px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{
background:var(--card);border-radius:var(--radius);padding:18px 20px;
text-align:center
}
.stat-num{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.stat-label{font-size:13px;color:var(--text3);margin-top:4px}
.stat.green .stat-num{color:var(--green)}
.stat.blue .stat-num{color:var(--blue)}
.stat.orange .stat-num{color:var(--orange)}
.stat.red .stat-num{color:var(--red)}

/* ENTRY CARDS */
.entry{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.entry-card{
border-radius:var(--radius);padding:24px;text-align:center;
cursor:pointer;transition:transform .15s,box-shadow .15s;
border:none
}
.entry-card:active{transform:scale(.98)}
.entry-card.off{opacity:.35;pointer-events:none}
.entry-card.submit{background:var(--green-bg)}
.entry-card.late{background:var(--orange-bg)}
.entry-icon{font-size:36px;margin-bottom:8px}
.entry-name{font-size:17px;font-weight:700;margin-bottom:2px}
.entry-card.submit .entry-name{color:var(--green)}
.entry-card.late .entry-name{color:#B26500}
.entry-desc{font-size:13px;color:var(--text3)}
.entry-count{
display:inline-block;margin-top:8px;padding:4px 14px;
border-radius:14px;font-size:13px;font-weight:600
}
.entry-card.submit .entry-count{background:var(--green);color:#fff}
.entry-card.late .entry-count{background:var(--orange);color:#fff}
@media(max-width:768px){.entry{grid-template-columns:1fr}}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
text-align:left;padding:10px 12px;
font-size:12px;font-weight:600;color:var(--text3);
text-transform:uppercase;letter-spacing:.3px;
background:transparent;border-bottom:1px solid var(--gray3)
}
td{padding:12px;border-bottom:1px solid var(--gray4);color:var(--text2)}
tr:last-child td{border-bottom:none}

/* BADGE */
.badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:12px;font-weight:600}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-orange{background:var(--orange-bg);color:#B26500}
.b-green{background:var(--green-bg);color:var(--green)}

/* TYPE TAG */
.typ{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600}
.t-y{background:var(--orange-bg);color:#B26500}
.t-x{background:var(--blue-bg);color:var(--blue)}

/* BUTTONS */
.btn{
padding:8px 18px;border:none;border-radius:10px;
cursor:pointer;font-size:14px;font-weight:600;
transition:opacity .2s;display:inline-flex;align-items:center;gap:4px
}
.btn:active{opacity:.7}
.b-primary{background:var(--blue);color:#fff}
.b-success{background:var(--green);color:#fff}
.b-warn{background:var(--orange);color:#fff}
.b-gray{background:var(--gray4);color:var(--text)}
.b-danger{background:var(--red);color:#fff}
.b-sm{padding:5px 12px;font-size:13px}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--gray3);overflow-x:auto}
.tab{
padding:10px 16px;cursor:pointer;font-size:14px;
color:var(--text3);border-bottom:2px solid transparent;
margin-bottom:-1px;white-space:nowrap;font-weight:500;transition:all .15s
}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* MODAL */
.modal-bg{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.4);z-index:200;
padding:20px;overflow-y:auto;
backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)
}
.modal-bg.show{display:flex;justify-content:center;align-items:flex-start}
.modal{
background:var(--card);border-radius:20px;padding:28px;
width:100%;max-width:560px;margin-bottom:40px;
box-shadow:0 10px 40px rgba(0,0,0,.1)
}
.modal.wide{max-width:860px}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;letter-spacing:-.5px}

/* FORM */
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--text3);margin-bottom:6px}
.field input,.field select,.field textarea{
width:100%;padding:12px 14px;
background:var(--gray4);border:1px solid transparent;
border-radius:10px;font-size:15px;color:var(--text);
font-family:inherit;transition:all .2s
}
.field input:focus,.field select:focus,.field textarea:focus{
outline:none;background:#fff;border-color:var(--blue);
box-shadow:0 0 0 3px rgba(0,122,255,.1)
}
.field textarea{min-height:80px;resize:vertical}

/* UPLOAD */
.upload-zone{
border:2px dashed var(--gray2);border-radius:14px;
padding:32px;text-align:center;cursor:pointer;
background:var(--gray4);transition:all .2s
}
.upload-zone:hover{border-color:var(--blue);background:var(--blue-bg)}
.upload-icon{font-size:36px;margin-bottom:8px}
.upload-text{font-size:14px;color:var(--text3)}
.preview-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.preview-thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--gray3)}
.preview-thumb img{width:100%;height:100%;object-fit:cover}
.preview-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* GRADE LAYOUT */
.grade-grid{display:grid;grid-template-columns:1fr 300px;gap:20px}
.grade-imgs{background:var(--gray4);border-radius:14px;padding:16px}
.grade-imgs img{width:100%;border-radius:10px;margin-bottom:12px;border:1px solid var(--gray3);cursor:zoom-in}
@media(max-width:768px){.grade-grid{grid-template-columns:1fr}}

/* ALERT */
.alert{
padding:12px 14px;border-radius:10px;margin-bottom:14px;
font-size:14px;display:flex;gap:8px;align-items:flex-start
}
.a-blue{background:var(--blue-bg);color:#0040A0}
.a-orange{background:var(--orange-bg);color:#8C5000}

/* PROGRESS */
.progress{height:6px;background:var(--gray3);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px}

/* SCORE */
.score{font-size:20px;font-weight:700;color:var(--blue)}
.feedback{background:var(--gray4);border-radius:10px;padding:12px;font-size:13px;color:var(--text2);line-height:1.5;margin-top:6px}

/* LIST ROW */
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--gray4)}
.row:last-child{border-bottom:none}

/* LINK */
.link-box{
background:#1C1C1E;color:#5AC8FA;border-radius:10px;
padding:12px 14px;font-family:monospace;font-size:13px;
word-break:all;cursor:pointer
}

/* TA LOAD */
.load-card{
text-align:center;padding:12px 20px;border-radius:12px;min-width:90px
}
.load-name{font-size:14px;font-weight:600}
.load-num{font-size:24px;font-weight:700;margin:4px 0}
.load-label{font-size:11px;color:var(--text3)}

@media(max-width:768px){
.container{padding:16px 12px}
.page-title{font-size:22px}
.login-card{padding:32px 24px}
}
</style>
</head>
<body>
<div id="rt"></div>
<div class="modal-bg" id="mbg"><div class="modal" id="mdl"></div></div>
<script>
var K='hw_v9',AP='1234567',DEF_PWD='1234';
var TP={yingyongwen:{l:'应用文',s:'应用文',m:15,c:'t-y'},xuxie:{l:'读后续写',s:'续写',m:25,c:'t-x'}};
// 自动生成助教和学生数据
var TA_NAMES=['王雪','赵磊','林婷','陈静','刘洋','张芳','李明','周伟','孙丽','吴敏','郑华','冯雪','杨光','许晴','韩雪','沈月','朱莉','秦风','尤浩','许薇','何琳','吕鹏','施莹','张恒','赵丽','钱进','孙杰','李娜','周涛','吴佳'];
var STU_SURNAMES=['李','王','张','刘','陈','杨','赵','黄','周','吴','徐','孙','胡','朱','高','林','何','郭','马','罗','梁','宋','郑','谢','韩','唐','冯','于','董','萧','程','曹','袁','邓','许','傅','沈','曾','彭','吕','苏','卢','蒋','蔡','贾','丁','魏','薛','叶','阎','余','潘','杜','戴','夏','钟','汪','田','任','姜','范','方','石','姚','谭','廖','邹','熊','金','陆','郝','孔','白','崔','康','毛','邱','秦','江','史','顾','侯','邵','孟','龙','万','段','雷','钱','汤','尹','黎','易','常','武','乔','贺','赖','龚','文'];
var STU_GIVEN=['明','芳','洋','强','丽','伟','华','雪','静','磊','婷','杰','敏','辉','颖','波','琳','鑫','鹏','慧','晨','宇','佳','欣','怡','晴','瑞','凯','悦','晨阳','子涵','梓豪','一诺','欣怡','浩然','诗涵','雨泽','可欣','子轩','雅琪','嘉诚','若彤','天佑','思远','梦琪','宇航','紫涵','皓轩','语馨','艺涵','智轩','雨桐','子墨','瑾萱','皓宇','梦洁','若汐','奕辰','可馨','一鸣','子睿','芷晴','沐辰','清扬','玥曈','璟雯','煜城','婉清','伯懿','承泽','楚楚','敦言','尔雅','方遒','芬馥','格格','海棠','涵煦','翰飞','含烟','晗日','飞跃','驰骋','初瑶','丹秋','德明','东风','朵儿','恩霈','方仪','丰雅'];
function genDef(){
var tas=[],sts=[];
var nTA=30,nSTU=500;
for(var t=0;t<nTA;t++){
var tid='T'+('000'+(t+1)).slice(-3);
tas.push({i:tid,n:TA_NAMES[t]||('助教'+(t+1)),pwd:DEF_PWD,ch:0});
}
var nameIdx=0;
for(var s=0;s<nSTU;s++){
var sid='S'+('000'+(s+1)).slice(-4);
var sn=STU_SURNAMES[nameIdx%STU_SURNAMES.length]+STU_GIVEN[nameIdx%STU_GIVEN.length];
nameIdx++;
var taIdx=s%nTA;
sts.push({i:sid,n:sn,t:tas[taIdx].i,pwd:DEF_PWD,ch:0});
}
return{
tas:tas,sts:sts,
asg:[{i:'a1',tp:'yingyongwen',ti:'第1课 · 应用文 — 建议信',dl:'2026-08-20T23:59',pub:true},
{i:'a2',tp:'xuxie',ti:'第2课 · 读后续写 — 记叙文',dl:'2026-08-25T23:59',pub:true}],
sub:[{i:'x1',si:'S0001',ai:'a1',img:[],nt:'',tp:'正常提交',st:'2026-08-10T15:30',sd:'已批改',ti:'T001',sc:'12',fb:'格式正确，语言可更精练。',gt:'2026-08-11T10:00'},
{i:'x2',si:'S0002',ai:'a1',img:[],nt:'',tp:'正常提交',st:'2026-08-10T16:00',sd:'待批改',ti:'T001',sc:'',fb:'',gt:''}],
mreq:[],lateQueue:[]
}}
function def(){return genDef()}
function ldb(){var r=localStorage.getItem(K);if(!r){var d=def();svb(d);return d}try{return JSON.parse(r)}catch(e){var d=def();svb(d);return d}}
function svb(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){alert('存储不足')}}
var DB=ldb(),ses=null,pImg=[];
function gS(i){return DB.sts.find(function(s){return s.i===i})}
function gT(i){return DB.tas.find(function(t){return t.i===i})}
function gA(i){return DB.asg.find(function(a){return a.i===i})}
function sN(i){var s=gS(i);return s?s.n:'?'}
function tN(i){var t=gT(i);return t?t.n:'?'}
function aN(i){var a=gA(i);return a?a.ti:'?'}
function aTP(i){var a=gA(i);return a?a.tp:'yingyongwen'}
function fmt(t){return t?t.replace('T',' ').replace(/:\d{2}$/,''):'-'}
function late(s,d){return new Date(s)>new Date(d)}
function now(){var d=new Date(),p=function(n){return(''+n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function uid(){return 'id'+Date.now()+Math.random().toString(36).slice(2,5)}
function hasSub(si,ai){return DB.sub.some(function(s){return s.si===si&&s.ai===ai})}
function getSub(si,ai){return DB.sub.find(function(s){return s.si===si&&s.ai===ai})}
function getMR(si,ai){return DB.mreq.find(function(r){return r.si===si&&r.ai===ai&&r.sd==='pending'})}
function H(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function findLeastBusyTA(){var c={};DB.tas.forEach(function(t){c[t.i]=0});DB.sub.forEach(function(s){if(s.sd==='待批改'&&c[s.ti]!==undefined)c[s.ti]++});var b=DB.tas[0].i,m=c[b];DB.tas.forEach(function(t){if(c[t.i]<m){m=c[t.i];b=t.i}});return b}

// LOGIN
function showLogin(){
document.getElementById('rt').innerHTML='<div class="login-screen"><div class="login-box">'+
'<div class="login-logo"><img src="logo.png" alt="IAI English" onerror="this.style.display=\'none\'"></div>'+
'<h2>IAI English</h2>'+
'<div class="user-box"><input type="text" id="lid" required onkeyup="if(event.key===\'Enter\')document.getElementById(\'lpwd\').focus()"><label>学号 / 工号</label></div>'+
'<div class="user-box"><input type="password" id="lpwd" required onkeyup="if(event.key===\'Enter\')doLogin()"><label>密码</label></div>'+
'<button class="login-btn" onclick="doLogin()">登 录</button>'+
'<div class="login-hint">学生 S0001~S0500 / 助教 T001~T030 / 管理员 admin<br>默认密码 1234，首次登录后需修改</div>'+
'</div></div>';
}
function doLogin(){
var id=document.getElementById('lid').value.trim().toUpperCase();
var pwd=document.getElementById('lpwd').value;
if(!id){alert('请输入学号');return}
if(!pwd){alert('请输入密码');return}
if(id==='ADMIN'){if(pwd!==AP){alert('密码错误');return}ses={r:'admin',i:'admin',n:'管理员'};go();return}
var s=gS(id);if(s){if(s.pwd!==pwd){alert('密码错误');return}ses={r:'student',i:s.i,n:s.n};if(!s.ch){showCP();return}go();return}
var t=gT(id);if(t){if(t.pwd!==pwd){alert('密码错误');return}ses={r:'ta',i:t.i,n:t.n};if(!t.ch){showCP();return}go();return}
alert('未找到该学号/工号');
}
function showCP(){
var role=ses.r==='student'?'学生':ses.r==='ta'?'助教':'';
document.getElementById('rt').innerHTML='<div class="login-screen"><div class="login-box">'+
'<div class="login-logo"><img src="logo.png" alt="IAI English" onerror="this.style.display=\'none\'"></div>'+
'<h2>IAI English</h2>'+
'<div style="text-align:center;color:#8E8E93;font-size:14px;margin-bottom:20px">'+role+'首次登录，请设置4位数字密码</div>'+
'<div class="user-box"><input type="password" id="np1" required maxlength="4" inputmode="numeric"><label>新密码（4位数字）</label></div>'+
'<div class="user-box"><input type="password" id="np2" required maxlength="4" inputmode="numeric"><label>确认密码</label></div>'+
'<button class="login-btn" onclick="doCP()">确认修改</button></div></div>';
}
function doCP(){
var p1=document.getElementById('np1').value,p2=document.getElementById('np2').value;
if(!/^\d{4}$/.test(p1)){alert('密码必须是4位数字');return}
if(p1===DEF_PWD){alert('不能与默认密码相同');return}
if(p1!==p2){alert('两次输入不一致');return}
if(ses.r==='student'){var s=gS(ses.i);s.pwd=p1;s.ch=1}
else if(ses.r==='ta'){var t=gT(ses.i);t.pwd=p1;t.ch=1}
svb(DB);alert('密码设置成功');go();
}
function logout(){ses=null;showLogin()}

function go(){
if(!ses){showLogin();return}
document.getElementById('rt').innerHTML='<div class="nav"><div class="nav-in"><div class="nav-logo">📝 作业管家</div><div class="nav-user"><span>'+H(ses.n)+'</span><button class="nav-logout" onclick="logout()">退出</button></div></div></div><div class="container" id="ac"></div>';
if(ses.r==='student')rStu();else if(ses.r==='ta')rTA();else rAdm();
var pa=sessionStorage.getItem('pSub');
if(pa&&ses.r==='student'){sessionStorage.removeItem('pSub');if(gA(pa)&&!hasSub(ses.i,pa))setTimeout(function(){openSubmit(pa)},400)}
}

// STUDENT
function rStu(){
var st=gS(ses.i),ta=gT(st.t);
var ms=DB.sub.filter(function(s){return s.si===ses.i});

function renderA(){var el=document.getElementById('atc');var h='<div class="card"><div class="card-header"><div class="card-title">作业列表</div><button class="btn b-primary b-sm" onclick="openPub()">＋ 发布</button></div><div class="card-body">';if(!DB.asg.length)h+='<div style="padding:20px;text-align:center;color:var(--text3)">暂无</div>';DB.asg.forEach(function(a){var tp=TP[a.tp],sb=DB.sub.filter(function(s){return s.ai===a.i}),g=sb.filter(function(s){return s.sd==='已批改'}).length,r=DB.sts.length?Math.round(sb.length/DB.sts.length*100):0,od=new Date(a.dl)<new Date();h+='<div class="row"><div><div style="display:flex;align-items:center;gap:8px"><span class="typ '+tp.c+'">'+tp.l+'</span><strong>'+H(a.ti)+'</strong></div><div style="font-size:13px;color:var(--text3);margin-top:4px">'+fmt(a.dl)+(od?' · <span style="color:var(--red)">已截止</span>':'')+' · 交'+sb.length+' · 改'+g+' · '+r+'%</div><div class="progress" style="margin-top:6px;width:200px"><div class="progress-fill" style="width:'+r+'%;background:'+(r>=80?'var(--green)':r>=50?'var(--orange)':'var(--red)')+'"></div></div></div><div style="display:flex;gap:6px"><button class="btn b-gray b-sm" onclick="showLink(\''+a.i+'\')">🔗</button><button class="btn b-gray b-sm" onclick="openEditA(\''+a.i+'\')">编辑</button></div></div>'});h+='</div></div>';el.innerHTML=h}
function renderLQ(){var el=document.getElementById('atc');var lq=DB.lateQueue.filter(function(q){return q.sd==='待分配'});if(!lq.length){el.innerHTML='<div class="card card-pad" style="text-align:center;color:var(--text3)">没有待分配的补交</div>';return}var h='<div class="card"><div class="card-header"><div class="card-title">⏰ 待分配补交（'+lq.length+'）</div></div><div class="card-body">';lq.forEach(function(q){var tp=TP[aTP(q.ai)];h+='<div style="padding:14px 0;border-bottom:1px solid var(--gray4)"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><div><strong>'+H(sN(q.si))+'</strong>（'+q.si+'）<span class="typ '+tp.c+'">'+tp.s+'</span> '+H(aN(q.ai))+'</div><span style="font-size:12px;color:var(--text3)">'+fmt(q.st)+'</span></div><div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px;color:var(--text3)">分配给</span><select id="ta_'+q.i+'" style="padding:6px 10px;border:1px solid var(--gray3);border-radius:8px;font-size:14px">'+DB.tas.map(function(t){var c=DB.sub.filter(function(s){return s.ti===t.i&&s.sd==='待批改'}).length;return '<option value="'+t.i+'">'+t.n+'（'+c+'份）</option>'}).join('')+'</select><button class="btn b-primary b-sm" onclick="assignLate(\''+q.i+'\')">分配</button></div></div>'});h+='</div></div>';el.innerHTML=h}
function assignLate(qid){var q=DB.lateQueue.find(function(x){return x.i===qid});if(!q)return;var ti=document.getElementById('ta_'+qid).value;DB.sub.push({i:uid(),si:q.si,ai:q.ai,img:q.img,nt:q.nt,tp:'补交',st:q.st,sd:'待批改',ti:ti,sc:'',fb:'',gt:''});q.sd='已分配';q.aTA=ti;q.aTime=now();svb(DB);rAdm();document.querySelectorAll('#atb .tab').forEach(function(x){x.classList.remove('on')});renderLQ()}
function renderAll(){var el=document.getElementById('atc');var h='<div class="card"><table><thead><tr><th>学号</th><th>学生</th><th>类型</th><th>作业</th><th>提交</th><th>状态</th><th>成绩</th><th>助教</th></tr></thead><tbody>';DB.sub.sort(function(a,b){return new Date(b.st)-new Date(a.st)}).forEach(function(s){var tp=TP[aTP(s.ai)];h+='<tr><td style="color:var(--text3)">'+s.si+'</td><td><strong>'+H(sN(s.si))+'</strong></td><td><span class="typ '+tp.c+'">'+tp.s+'</span></td><td>'+H(aN(s.ai))+'</td><td><span class="badge '+(s.tp==='补交'?'b-red':'b-blue')+'">'+s.tp+'</span></td><td><span class="badge '+(s.sd==='已批改'?'b-green':'b-orange')+'">'+s.sd+'</span></td><td>'+(s.sc?'<span class="score">'+s.sc+'</span>/'+tp.m:'—')+'</td><td>'+H(tN(s.ti))+'</td></tr>'});h+='</tbody></table></div>';el.innerHTML=h}
function renderMiss(){var el=document.getElementById('atc'),rows='';DB.asg.filter(function(a){return a.pub}).forEach(function(a){var sb=DB.sub.filter(function(s){return s.ai===a.i}).map(function(s){return s.si}),ms=DB.sts.filter(function(s){return sb.indexOf(s.i)<0});if(ms.length){var od=new Date(a.dl)<new Date(),tp=TP[a.tp];rows+='<tr><td><span class="typ '+tp.c+'">'+tp.s+'</span> '+H(a.ti)+'</td><td><span class="badge '+(od?'b-red':'b-orange')+'">'+(od?'逾期':'进行中')+'</span></td><td>'+ms.length+'</td><td>'+ms.map(function(s){return s.n}).join('、')+'</td></tr>'}});el.innerHTML='<div class="card"><table><thead><tr><th>作业</th><th>状态</th><th>未交</th><th>名单</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text3)">全部已提交 🎉</td></tr>')+'</tbody></table></div>'}
function renderMR(){var el=document.getElementById('atc'),rq=DB.mreq.sort(function(a,b){return new Date(b.rt)-new Date(a.rt)});if(!rq.length){el.innerHTML='<div class="card card-pad" style="text-align:center;color:var(--text3)">暂无修改申请</div>';return}var h='<div class="card"><div class="card-body">';rq.forEach(function(r){var st=gS(r.si),tp=TP[aTP(r.ai)];h+='<div style="padding:14px 0;border-bottom:1px solid var(--gray4)"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><div><strong>'+H(st?st.n:'?')+'</strong>（'+r.si+'）<span class="typ '+tp.c+'">'+tp.s+'</span> '+H(aN(r.ai))+'</div>'+(r.sd==='pending'?'<span class="badge b-orange">待处理</span>':r.sd==='approved'?'<span class="badge b-green">已通过</span>':'<span class="badge b-red">已拒绝</span>')+'</div><div style="font-size:12px;color:var(--text3);margin-bottom:6px">'+fmt(r.rt)+'</div><div class="feedback">'+H(r.rs)+'</div>'+(r.sd==='pending'?'<div style="display:flex;gap:8px;margin-top:10px"><button class="btn b-success b-sm" onclick="apprMR(\''+r.i+'\')">✅同意</button><button class="btn b-danger b-sm" onclick="rejMR(\''+r.i+'\')">❌拒绝</button></div>':'')+'</div>'});h+='</div></div>';el.innerHTML=h}
function renderStu(){var el=document.getElementById('atc');var h='<div class="card"><div class="card-header"><div class="card-title">学生（'+DB.sts.length+'）</div><button class="btn b-primary b-sm" onclick="openAddStu()">＋添加</button></div><table><thead><tr><th>学号</th><th>姓名</th><th>助教</th><th>已交</th><th></th></tr></thead><tbody>';DB.sts.forEach(function(s){var sb=DB.sub.filter(function(x){return x.si===s.i});h+='<tr><td style="color:var(--text3)">'+s.i+'</td><td><strong>'+H(s.n)+'</strong></td><td>'+H(tN(s.t))+'</td><td>'+sb.length+'</td><td><button class="btn b-gray b-sm" onclick="openEditStu(\''+s.i+'\')">编辑</button></td></tr>'});h+='</tbody></table></div>';el.innerHTML=h}
function showLink(aid){var a=gA(aid),tp=TP[a.tp],lk=location.href.split('?')[0]+'?submit='+aid;var m=document.getElementById('mdl');m.className='modal';m.innerHTML='<div class="modal-title">🔗 提交链接</div><div style="margin-bottom:14px"><span class="typ '+tp.c+'">'+tp.l+'</span> <strong>'+H(a.ti)+'</strong></div><div class="alert a-blue"><span>ℹ️</span><div>发到群里，学生点开→登录→自动到提交页</div></div><div class="field"><label>链接（点击复制）</label><div class="link-box" onclick="cpTxt(this.textContent)">'+lk+'</div></div><div class="field"><label>通知文本（点击复制）</label><div class="link-box" onclick="cpTxt(this.textContent)">📝 '+tp.l+'作业：'+a.ti+'\n截止：'+fmt(a.dl)+'\n请点链接登录后提交：\n'+lk+'</div></div><div style="display:flex;gap:10px"><button class="btn b-primary" style="flex:1;padding:14px" onclick="cpTxt(\''+lk+'\')">复制链接</button><button class="btn b-gray" onclick="cmodal()">关闭</button></div>';document.getElementById('mbg').classList.add('show')}
function cpTxt(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');var d=document.createElement('div');d.textContent='已复制';d.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:12px;font-weight:600;z-index:9999;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)';document.body.appendChild(d);setTimeout(function(){d.remove()},1500)}catch(e){alert('请手动复制')}document.body.removeChild(ta)}
function openPub(){var m=document.getElementById('mdl');m.className='modal';var d=new Date();d.setDate(d.getDate()+7);var opts=Object.keys(TP).map(function(k){var v=TP[k];return '<label style="display:flex;align-items:center;gap:8px;padding:12px;background:var(--gray4);border-radius:10px;cursor:pointer;margin-bottom:6px" onclick="document.querySelectorAll(\'input[name=at]\').forEach(function(r){r.checked=false});this.querySelector(\'input\').checked=true"><input type="radio" name="at" value="'+k+'" '+(k==='yingyongwen'?'checked':'')+'><span class="typ '+v.c+'" style="padding:4px 10px">'+v.l+'</span><span style="color:var(--text3);font-size:13px">满分'+v.m+'</span></label>'}).join('');m.innerHTML='<div class="modal-title">发布新作业</div><div class="field"><label>作业类型</label>'+opts+'</div><div class="field"><label>标题</label><input id="nAt" placeholder="如：第3课 · 应用文 — 感谢信" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div class="field"><label>截止时间</label><input type="datetime-local" id="nAd" value="'+d.toISOString().slice(0,16)+'" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div class="alert a-blue"><span>ℹ️</span><div>截止前=正常提交（自动分配助教）；截止后=补交（管理员手动分配）</div></div><div style="display:flex;gap:10px"><button class="btn b-primary" style="flex:1;padding:14px;font-size:16px" onclick="doPub()">发布并生成链接</button><button class="btn b-gray" onclick="cmodal()">取消</button></div>';document.getElementById('mbg').classList.add('show')}
function doPub(){var te=document.querySelector('input[name="at"]:checked'),tp=te?te.value:'yingyongwen',ti=(document.getElementById('nAt').value||'').trim();if(!ti){alert('请输入标题');return}var aid=uid();DB.asg.push({i:aid,tp:tp,ti:ti,dl:document.getElementById('nAd').value,pub:true});svb(DB);cmodal();go();setTimeout(function(){showLink(aid)},200)}
function openEditA(aid){var a=gA(aid),m=document.getElementById('mdl');m.className='modal';m.innerHTML='<div class="modal-title">编辑作业</div><div class="field"><label>类型</label><select id="eAt" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px">'+Object.keys(TP).map(function(k){var v=TP[k];return '<option value="'+k+'" '+(a.tp===k?'selected':'')+'>'+v.l+'（'+v.m+'分）</option>'}).join('')+'</select></div><div class="field"><label>标题</label><input id="eTi" value="'+H(a.ti)+'" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div class="field"><label>截止</label><input type="datetime-local" id="eDl" value="'+a.dl+'" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div style="display:flex;gap:10px"><button class="btn b-primary" style="flex:1;padding:14px" onclick="doEditA(\''+aid+'\')">保存</button><button class="btn b-gray" onclick="cmodal()">取消</button></div>';document.getElementById('mbg').classList.add('show')}
function doEditA(aid){var a=gA(aid);a.tp=document.getElementById('eAt').value;a.ti=(document.getElementById('eTi').value||'').trim();a.dl=document.getElementById('eDl').value;svb(DB);cmodal();go()}
function openAddStu(){var m=document.getElementById('mdl');m.className='modal';m.innerHTML='<div class="modal-title">添加学生</div><div class="field"><label>学号</label><input id="nSi" placeholder="如 S009" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div class="field"><label>姓名</label><input id="nSn" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div class="field"><label>助教</label><select id="nSt" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px">'+DB.tas.map(function(t){return '<option value="'+t.i+'">'+t.n+'</option>'}).join('')+'</select></div><div style="display:flex;gap:10px"><button class="btn b-primary" style="flex:1;padding:14px" onclick="doAddStu()">添加</button><button class="btn b-gray" onclick="cmodal()">取消</button></div>';document.getElementById('mbg').classList.add('show')}
function doAddStu(){var id=(document.getElementById('nSi').value||'').trim().toUpperCase(),nm=(document.getElementById('nSn').value||'').trim();if(!id||!nm){alert('请填写完整');return}if(gS(id)){alert('已存在');return}DB.sts.push({i:id,n:nm,t:document.getElementById('nSt').value,pwd:DEF_PWD,ch:0});svb(DB);cmodal();go()}
function openEditStu(sid){var s=gS(sid),m=document.getElementById('mdl');m.className='modal';m.innerHTML='<div class="modal-title">编辑学生</div><div class="field"><label>学号</label><input value="'+s.i+'" disabled style="width:100%;padding:12px 14px;background:var(--gray4);border-radius:10px;font-size:15px"></div><div class="field"><label>姓名</label><input id="eSn" value="'+H(s.n)+'" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px"></div><div class="field"><label>助教</label><select id="eSt" style="width:100%;padding:12px 14px;background:var(--gray4);border:1px solid transparent;border-radius:10px;font-size:15px">'+DB.tas.map(function(t){return '<option value="'+t.i+'" '+(t.i===s.t?'selected':'')+'>'+t.n+'</option>'}).join('')+'</select></div><div style="display:flex;gap:10px"><button class="btn b-primary" style="flex:1;padding:14px" onclick="doEditStu(\''+sid+'\')">保存</button><button class="btn b-danger" onclick="doDelStu(\''+sid+'\')">删除</button><button class="btn b-gray" onclick="cmodal()">取消</button></div>';document.getElementById('mbg').classList.add('show')}
function doEditStu(sid){var s=gS(sid);s.n=(document.getElementById('eSn').value||'').trim();s.t=document.getElementById('eSt').value;svb(DB);cmodal();go()}
function doDelStu(sid){if(!confirm('确认删除？'))return;DB.sts=DB.sts.filter(function(s){return s.i!==sid});DB.sub=DB.sub.filter(function(s){return s.si!==sid});svb(DB);cmodal();go()}
function apprMR(rid){var r=DB.mreq.find(function(x){return x.i===rid});if(!r)return;if(!confirm('同意？原提交删除，可重新提交'))return;DB.sub=DB.sub.filter(function(s){return!(s.si===r.si&&s.ai===r.ai)});r.sd='approved';svb(DB);go()}
function rejMR(rid){var r=DB.mreq.find(function(x){return x.i===rid});if(!r)return;r.sd='rejected';svb(DB);go()}
function cmodal(){document.getElementById('mbg').classList.remove('show');document.getElementById('mdl').className='modal'}
document.getElementById('mbg').addEventListener('click',function(e){if(e.target===this)cmodal()});
var pa=new URLSearchParams(location.search).get('submit');
if(pa){sessionStorage.setItem('pSub',pa);history.replaceState(null,'',location.pathname)}
showLogin();
</script>
